# Pile pour un poste d'épreuve : un seul conteneur (cerebro-server), qui termine le TLS lui-même
# via un certificat auto-signé généré au premier démarrage (voir Program.cs et
# docs/DEPLOYMENT-SERVER.md, section Sécurisation du transport).
#
# Utilisation, depuis la racine du dépôt :
#   CEREBRO_SERVER_ADDRESS=192.168.1.10 docker compose -f deploy/docker-compose.yml up -d --build
#
# (remplacer 192.168.1.10 par l'IP/hostname réel du poste serveur sur le réseau d'épreuve - inclus
# comme SAN du certificat auto-généré ; optionnelle, "localhost" par défaut)

services:
  cerebro-server:
    build:
      context: ..
      dockerfile: src/Cerebro.Server/Dockerfile
    # En prod, ne pas éditer ce fichier : utiliser l'override deploy/docker-compose.prod.yml, qui
    # remplace "build:" par l'image publiée par la Release GitHub Actions
    # (.github/workflows/server-release.yml) pour ne pas avoir à reconstruire sur la machine
    # d'épreuve (voir les commentaires en tête de ce fichier).
    restart: unless-stopped
    environment:
      CEREBRO_SERVER_ADDRESS: ${CEREBRO_SERVER_ADDRESS:-localhost}
    ports:
      - "8443:8443"
    volumes:
      # db/ contient à la fois la base SQLite et le certificat TLS auto-signé (cerebro.pfx) :
      # sans ce volume, un nouveau certificat serait généré à chaque recréation du conteneur, ce
      # qui changerait l'empreinte SHA-256 à communiquer aux agents candidats - à ne surtout pas
      # perdre en cours d'épreuve (éviter tout "docker compose down -v" une fois une session
      # commencée). L'empreinte elle-même reste consultable après coup dans les logs :
      # "docker compose logs cerebro-server".
      - cerebro-db:/app/db
      - cerebro-screenshots:/app/screenshots

volumes:
  cerebro-db:
  cerebro-screenshots:
