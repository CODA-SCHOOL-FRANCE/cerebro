name: Publier xavier-agent (npm)

# Déclenché automatiquement par agent-release.yml (job publish-npm, needs: release) à chaque tag
# agent-vX.Y.Z, avec la même version - le wrapper npm reste ainsi toujours publié en même temps que
# le binaire qu'il télécharge au postinstall. workflow_dispatch reste disponible pour republier le
# wrapper seul (ex: fix du script postinstall) sans couper une nouvelle release de l'agent.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version npm à publier (ex: 1.0.1)"
        required: true
  workflow_call:
    inputs:
      version:
        description: "Version npm à publier (ex: 1.0.1)"
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging/npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm version "${{ inputs.version }}" --no-git-tag-version
      - run: npm install --omit=dev --ignore-scripts
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
