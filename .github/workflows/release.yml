name: Release Cerebro (serveur + agent)

# Un seul tag vX.Y.Z posé sur un commit de main déclenche tout : l'image Docker du serveur
# (publiée sur GHCR) ET les 4 exécutables candidat Xavier (Windows, macOS Intel/Apple Silicon,
# Linux), regroupés dans une seule Release GitHub - serveur et agent partagent désormais le même
# numéro de version (fusion d'anciens workflows séparés, agent-release.yml/server-release.yml, qui
# écoutaient deux espaces de tags distincts, agent-vX.Y.Z et vX.Y.Z). Le job `test` en amont sert
# de garde-fou commun : rien n'est publié si la suite de tests ne passe pas.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  # Partagé par build-agent et build-server : le déclencheur "push tags" accepte un tag posé sur
  # n'importe quelle branche, donc on vérifie explicitement que le commit tagué est bien un
  # ancêtre de main avant de publier quoi que ce soit (image Docker comme binaires agent).
  verify-tag-on-main:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Vérifier que le tag est sur main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne pointe pas vers un commit de main."
            exit 1
          fi

  build-agent:
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, osx-x64, osx-arm64, linux-x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publier (self-contained, fichier unique)
        run: >
          dotnet publish src/Cerebro.Agent -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Ajouter les instructions d'installation
        run: cp docs/USER-DOC.txt publish/${{ matrix.rid }}/USER-DOC.txt

      # Déjà nommé xavier.config.json (voir AgentConfigFile.FileName) : chargé directement par
      # l'agent au démarrage, à éditer par le surveillant avant distribution aux candidats (voir
      # docs/USER-DOC.txt) plutôt qu'à renommer soi-même.
      - name: Ajouter le fichier de configuration
        run: cp docs/xavier.config.json publish/${{ matrix.rid }}/xavier.config.json

      - name: Retirer les symboles de debug (pas utiles aux candidats, inutile de les distribuer)
        shell: bash
        run: rm -f publish/${{ matrix.rid }}/*.pdb

      - name: Empaqueter
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="Xavier-${version}-${{ matrix.rid }}.zip"
          (cd publish/${{ matrix.rid }} && zip -r "../../${archive}" .)
          echo "ARCHIVE_PATH=${archive}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: xavier-${{ matrix.rid }}
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 7

  build-server:
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Nom d'image (GHCR exige des minuscules)
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/cerebro-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Requis pour builder linux/arm64 depuis un runner amd64 (émulation) — l'image doit tourner
      # aussi bien sur un poste d'épreuve classique que sur un serveur ARM (ex: Raspberry Pi).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Cerebro.Server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Une seule Release GitHub par tag (contrainte GitHub) : ce job attend build-agent ET
  # build-server pour la créer une fois, avec les deux à l'intérieur - deux jobs séparés qui
  # tenteraient chacun de créer/modifier la Release du même tag en parallèle se marcheraient
  # dessus (nom/description de l'un écrasant l'autre selon l'ordre d'arrivée, non déterministe).
  release:
    needs: [build-agent, build-server]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.build-server.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: xavier-*
          path: artifacts
          merge-multiple: true

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: Cerebro ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.zip
          body: |
            **Serveur** — image Docker : `${{ needs.build-server.outputs.image }}:${{ needs.build-server.outputs.version }}`

            Déploiement recommandé (via `deploy/docker-compose.yml`, gère volumes et TLS) : voir
            [Déployer le serveur](https://github.com/CODA-SCHOOL-FRANCE/cerebro/blob/main/docs/DEPLOYMENT-SERVER.md).

            ```bash
            docker pull ${{ needs.build-server.outputs.image }}:${{ needs.build-server.outputs.version }}
            ```

            **Agent (Xavier)** — exécutable candidat autonome (Windows, macOS Intel/Apple Silicon,
            Linux) — aucune installation requise, un seul fichier par OS. Instructions
            d'installation et d'usage incluses dans chaque archive (`USER-DOC.txt`).

            | Archive | Système |
            |---|---|
            | `*-win-x64.zip` | Windows 64 bits |
            | `*-osx-x64.zip` | macOS Intel |
            | `*-osx-arm64.zip` | macOS Apple Silicon (M1/M2/M3/M4) |
            | `*-linux-x64.zip` | Linux 64 bits |

            Autres canaux d'installation de l'agent (npm, Homebrew, Scoop, script) : voir
            [Déployer l'agent](https://github.com/CODA-SCHOOL-FRANCE/cerebro/blob/main/docs/DEPLOYMENT-AGENT.md).

  # Republie le wrapper npm (packaging/npm) avec le même numéro de version que ce qui vient d'être
  # publié - voir npm-publish.yml (workflow_dispatch y reste disponible pour republier le wrapper
  # seul, sans nouvelle release).
  publish-npm:
    needs: release
    uses: ./.github/workflows/npm-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Le script d'installation et le bucket Scoop (bucket/xavier.json, ce dépôt) résolvent la
  # dernière release directement depuis ce dépôt, désormais public - rien à mirorer. Seule la
  # formule Homebrew reste à régénérer dans un dépôt séparé (homebrew-cerebro) : Homebrew impose
  # qu'un tap vive dans un dépôt nommé homebrew-<nom>, indépendamment de la visibilité de ce dépôt
  # - voir docs/DEPLOYMENT-AGENT.md.
  update-distribution-channels:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          pattern: xavier-*
          path: artifacts
          merge-multiple: true

      - name: Calculer les sha256 de chaque archive
        id: sums
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          for rid in win-x64 osx-x64 osx-arm64 linux-x64; do
            sha=$(sha256sum "artifacts/Xavier-${version}-${rid}.zip" | cut -d' ' -f1)
            echo "sha_${rid//-/_}=${sha}" >> "$GITHUB_OUTPUT"
          done

      # Un seul manifest (win-x64, seul RID Windows publié). Commit direct sur main (pas de PR) :
      # fichier généré à usage unique, sans valeur de revue humaine.
      - name: Mettre à jour le bucket Scoop (bucket/xavier.json)
        env:
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_WIN_X64: ${{ steps.sums.outputs.sha_win_x64 }}
        run: |
          mkdir -p bucket
          cat > bucket/xavier.json <<EOF
          {
              "version": "${VERSION}",
              "description": "Agent candidat Cerebro (Xavier)",
              "homepage": "https://github.com/CODA-SCHOOL-FRANCE/cerebro",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/CODA-SCHOOL-FRANCE/cerebro/releases/download/${GITHUB_REF_NAME}/Xavier-${VERSION}-win-x64.zip",
                      "hash": "${SHA_WIN_X64}"
                  }
              },
              "bin": "xavier.exe",
              "checkver": {
                  "github": "https://github.com/CODA-SCHOOL-FRANCE/cerebro"
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/CODA-SCHOOL-FRANCE/cerebro/releases/download/v\$version/Xavier-\$version-win-x64.zip"
                      }
                  }
              }
          }
          EOF
          git config user.name "xavier-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bucket/xavier.json
          git diff --cached --quiet || git commit -m "xavier ${GITHUB_REF_NAME}"
          git push origin HEAD:main

      - name: Mettre à jour le tap Homebrew (homebrew-cerebro)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_OSX_ARM64: ${{ steps.sums.outputs.sha_osx_arm64 }}
          SHA_OSX_X64: ${{ steps.sums.outputs.sha_osx_x64 }}
          SHA_LINUX_X64: ${{ steps.sums.outputs.sha_linux_x64 }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/CODA-SCHOOL-FRANCE/homebrew-cerebro.git" brew-repo
          cd brew-repo
          mkdir -p Formula
          cat > Formula/xavier.rb <<EOF
          class Xavier < Formula
            desc "Agent candidat Cerebro (surveillance d'épreuves)"
            homepage "https://github.com/CODA-SCHOOL-FRANCE/cerebro"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/CODA-SCHOOL-FRANCE/cerebro/releases/download/${GITHUB_REF_NAME}/Xavier-${VERSION}-osx-arm64.zip"
                sha256 "${SHA_OSX_ARM64}"
              end
              on_intel do
                url "https://github.com/CODA-SCHOOL-FRANCE/cerebro/releases/download/${GITHUB_REF_NAME}/Xavier-${VERSION}-osx-x64.zip"
                sha256 "${SHA_OSX_X64}"
              end
            end

            on_linux do
              url "https://github.com/CODA-SCHOOL-FRANCE/cerebro/releases/download/${GITHUB_REF_NAME}/Xavier-${VERSION}-linux-x64.zip"
              sha256 "${SHA_LINUX_X64}"
            end

            def install
              bin.install "xavier"
              # Champs à null par défaut (docs/xavier.config.json) : tant qu'il n'est pas édité par
              # le surveillant, l'agent retombe sur les prompts interactifs (voir Program.cs,
              # AgentConfigFile.Load(AppContext.BaseDirectory) - même dossier que le binaire).
              bin.install "xavier.config.json"
            end

            def caveats
              <<~EOS
                Un xavier.config.json a été déposé à côté du binaire (#{bin}) : si votre
                surveillant vous a communiqué les valeurs de la session, éditez-le pour ne plus
                avoir à les saisir à chaque lancement (sinon, laissez-le tel quel - xavier les
                redemandera simplement).
              EOS
            end

            test do
              assert_predicate bin/"xavier", :exist?
            end
          end
          EOF
          git config user.name "xavier-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/xavier.rb
          git diff --cached --quiet || git commit -m "xavier ${GITHUB_REF_NAME}"
          git push
