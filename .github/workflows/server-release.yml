name: Release Cerebro.Server

# Un tag vX.Y.Z posé sur un commit de main publie l'image Docker du backend sur GHCR et crée
# la Release GitHub correspondante. Les tests tournent d'abord : un tag qui ne compile/passe pas
# ne doit jamais être publié.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Le déclencheur "push tags" accepte un tag posé sur n'importe quelle branche : on vérifie
      # explicitement que le commit tagué est bien un ancêtre de main avant de publier quoi que ce soit.
      - name: Vérifier que le tag est sur main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne pointe pas vers un commit de main."
            exit 1
          fi

      - name: Nom d'image (GHCR exige des minuscules)
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/cerebro-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Requis pour builder linux/arm64 depuis un runner amd64 (émulation) — l'image doit tourner
      # aussi bien sur un poste d'examen classique que sur un serveur ARM (ex: Raspberry Pi).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Cerebro.Server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v3
        with:
          name: Cerebro.Server ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Image Docker : `${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}`

            ```bash
            docker pull ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            docker run -d \
              -p 8080:8080 \
              -v cerebro-db:/app/db \
              -v cerebro-screenshots:/app/screenshots \
              --name cerebro-server \
              ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ```
