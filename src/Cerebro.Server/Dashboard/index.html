<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>

    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cerebro - Dashboard surveillant</title>
    <link href="css/dashboard.css" rel="stylesheet"/>
</head>
<body>
<div class="frame">
    <div aria-hidden="true" class="crt-overlay"></div>

    <header class="hud">
        <div class="hud-brand">
            <span class="brand-title">CEREBRO<span class="brand-cursor"></span></span>
            <span class="brand-sub">Surveillance</span>
        </div>
        <div class="hud-stats">
            <span class="stat-sessions">SESSIONS <strong id="hudSessionCount">0</strong></span>
            <span class="stat-online">EN LIGNE <strong id="hudOnlineCount">-</strong></span>
            <button class="btn btn-ghost hud-logout" id="logoutButton">⏻ DÉCONNEXION</button>
        </div>
    </header>

    <section class="view" id="sessionPicker">
        <div class="view-head">
            <div>
                <div class="eyebrow">▚ SÉLECTIONNE UNE ÉPREUVE</div>
                <h1>Épreuves planifiées</h1>
            </div>
            <div class="view-head-actions">
                <button class="btn btn-outline" id="createSessionButton">+ NOUVELLE SESSION</button>
                <button class="btn btn-lime" id="refreshButton">↻ ACTUALISER</button>
            </div>
        </div>
        <div class="refresh-flash" hidden id="refreshFlash">✓ liste synchronisée à <span id="refreshFlashTime"></span>
        </div>

        <div class="session-list" id="sessionList"></div>
    </section>

    <div class="activity-overlay" hidden id="createSessionOverlay">
        <aside aria-labelledby="createSessionDrawerLabel" class="activity-drawer create-session-drawer">
            <div class="drawer-head">
                <span class="eyebrow" id="createSessionDrawerLabel">▚ NOUVELLE SESSION</span>
                <button aria-label="Fermer" class="drawer-close" id="closeCreateSessionButton">✕</button>
            </div>

            <form class="login-form" id="createSessionForm">
                <label class="login-label" for="createSessionCode">Code de session</label>
                <input autocomplete="off" autofocus class="login-input" id="createSessionCode" name="sessionCode"
                       required type="text"/>

                <label class="login-label" for="createSessionRosterFile">Roster (fichier JSON de l'école)</label>
                <input accept="application/json,.json" class="login-input" id="createSessionRosterFile" name="rosterFile"
                       type="file"/>

                <label class="login-label" for="createSessionRosterJson">Ou coller le JSON directement</label>
                <textarea class="login-input create-session-roster" id="createSessionRosterJson" name="rosterJson"
                          placeholder='{"ec": "E01", "date": "2026-10-09", "rattrapage": false, "etudiants": {"...": {"nom": "...", "id": "..."}}}'
                          rows="8"></textarea>

                <div class="login-error" hidden id="createSessionError"></div>

                <button class="btn btn-lime login-submit" type="submit">▶ CRÉER LA SESSION</button>
            </form>
        </aside>
    </div>

    <section class="view" hidden id="sessionDetail">
        <div class="detail-toolbar">
            <button class="btn btn-ghost" id="backButton">← LISTE DES ÉPREUVES</button>
            <span class="sep">|</span>
            <span class="session-live-status" id="currentSessionStatus"></span>
        </div>
        <h1 class="session-title" id="currentSessionTitle">Détail de l'épreuve</h1>
        <div class="detail-actions">
            <button class="btn btn-lime" id="startButton">▶ DÉMARRER L'ÉPREUVE</button>
            <button class="btn btn-coral" id="stopButton">■ ARRÊTER L'ÉPREUVE</button>
            <button class="btn btn-outline" id="toggleActivityButton">☰ JOURNAL D'ACTIVITÉ</button>
        </div>

        <div class="candidate-table">
            <div class="candidate-head">
                <div>Candidat</div>
                <div>Connexion</div>
                <div>Statut</div>
                <div>Dernier ping</div>
                <div>Dernier screenshot</div>
            </div>
            <div id="candidateList"></div>
        </div>
    </section>

    <div class="activity-overlay" hidden id="activityOverlay">
        <aside aria-labelledby="activityDrawerLabel" class="activity-drawer">
            <div class="drawer-head">
                <span class="eyebrow" id="activityDrawerLabel">▚ JOURNAL D'ACTIVITÉ</span>
                <button aria-label="Fermer" class="drawer-close" id="closeActivityButton">✕</button>
            </div>
            <div id="activityList"></div>
        </aside>
    </div>

    <footer class="page-footer">
        <span>© <span id="footerYear"></span> Cerebro - Surveillance des épreuves</span>
        <span class="footer-status">SYSTÈME OPÉRATIONNEL</span>
    </footer>
</div>

<script src="lib/signalr/signalr.min.js"></script>
<script src="js/main.js" type="module"></script>
</body>
</html>
